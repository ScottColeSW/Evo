<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Evolution2Civ — LLM Console</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #141419; color: #e2e2e7; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  #header {
    display: flex; align-items: center; gap: 16px; padding: 10px 18px;
    background: #1a1a24; border-bottom: 2px solid #2a2a3a; flex-shrink: 0;
  }
  #header h1 { font-size: 15px; color: #a5b4fc; letter-spacing: 0.5px; margin: 0; flex-shrink: 0; }
  #conn-status {
    padding: 6px 14px; border-radius: 4px; font-size: 11px; font-family: monospace;
    font-weight: bold; background: #7f1d1d; color: #fca5a5;
  }
  #conn-status.live { background: #065f46; color: #34d399; }
  #cycle-badge {
    padding: 6px 14px; background: #1e293b; color: #cbd5e1; font-weight: bold;
    border-radius: 4px; font-size: 11px; font-family: monospace;
  }
  #header .hint { margin-left: auto; color: #6b7280; font-size: 11px; }

  /* Explicit request: "in a 4 column format" -- 2 tribes x (prompt, response). */
  #grid {
    flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: auto 1fr; min-height: 0;
  }

  .build-header {
    grid-row: 1; padding: 10px 14px; background: #1a1a24; border-bottom: 1px solid #2a2a3a;
    border-right: 1px solid #2a2a3a; font-family: monospace; font-size: 12px; color: #cbd5e1;
    white-space: pre-wrap; line-height: 1.5;
  }
  .build-header .tribe-name { font-size: 13px; font-weight: bold; margin-bottom: 4px; display: block; }

  .col {
    grid-row: 2; overflow-y: auto; padding: 10px; border-right: 1px solid #2a2a3a;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; line-height: 1.5;
  }
  .col-label {
    position: sticky; top: -10px; margin: -10px -10px 8px -10px; padding: 4px 10px;
    background: #12121a; color: #6b7280; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; border-bottom: 1px solid #2a2a3a;
  }
  .col.prompt-col { background: #16161e; }
  .col.response-col { background: #14141c; }

  .entry { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed #2a2a3a; }
  .entry:last-child { border-bottom: none; }
  .entry-meta { color: #6b7280; font-size: 10px; margin-bottom: 4px; }
  .entry-text { white-space: pre-wrap; word-break: break-word; color: #d1d5db; }
  .response-col .entry-text { color: #a5f3c4; }
  .empty-note { color: #4b5563; font-style: italic; }

  #no-run {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: #6b7280; font-size: 13px; grid-column: 1 / -1;
  }
</style>
</head>
<body>
  <div id="header">
    <h1>LLM CONSOLE</h1>
    <span id="conn-status">connecting…</span>
    <span id="cycle-badge">cycle —</span>
    <span class="hint">raw prompt/response, both tribes — text only, no board</span>
  </div>
  <div id="grid"></div>

<script>
// Explicit request, 2026-09-09: "a separate page that shows me, in a 4 column
// format, live, what we tell the llm, how it responses... I want to see the
// raw info we sent and how they reply. I don't need the visual board for this
// look." Fixed at 2 tribes / 4 columns (prompt+response per tribe) per
// explicit follow-up -- not a general N-tribe layout.
//
// This page never starts its own Simulation -- it OBSERVEs whatever run is
// already going in the main board's own tab (see backend/app.py's ws_handler
// OBSERVE command), so opening this alongside the board shows the SAME live
// run, not a second independent one.

const grid = document.getElementById("grid");
const connStatus = document.getElementById("conn-status");
const cycleBadge = document.getElementById("cycle-badge");

let socket = null;
let renderedCycleByColumn = {}; // `${tribeId}:${kind}` -> highest cycle number already appended
let columnsBuilt = false;

function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => socket.send(JSON.stringify({ command: "OBSERVE" }));
  socket.onmessage = (event) => {
    let state;
    try {
      state = JSON.parse(event.data);
    } catch (err) {
      console.error("Failed to parse a debug snapshot -- dropping this update.", err);
      return;
    }
    handleState(state);
  };
  socket.onclose = () => {
    connStatus.textContent = "disconnected — retrying…";
    connStatus.classList.remove("live");
    setTimeout(connect, 2000);
  };
  socket.onerror = () => { try { socket.close(); } catch (e) {} };
}

function handleState(state) {
  const tribes = state.tribes || {};
  const tribeIds = Object.keys(tribes).sort();
  cycleBadge.textContent = `cycle ${state.cycle ?? "—"}`;

  if (tribeIds.length === 0) {
    connStatus.textContent = "waiting for a run to start…";
    connStatus.classList.remove("live");
    if (!columnsBuilt) {
      grid.innerHTML = `<div id="no-run">No active run yet. Start one in the main board tab -- this page attaches to it automatically.</div>`;
    }
    // Keep retrying OBSERVE -- a run may start after this page opened.
    setTimeout(() => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ command: "OBSERVE" })); }, 2000);
    return;
  }

  connStatus.textContent = "live";
  connStatus.classList.add("live");

  if (!columnsBuilt) {
    buildColumns(tribeIds.slice(0, 2));
    columnsBuilt = true;
  }

  tribeIds.slice(0, 2).forEach((tid) => {
    const entry = tribes[tid];
    updateBuildHeader(tid, entry.tribe || {});
    appendNewTranscriptEntries(tid, entry.transcript || []);
  });
}

function buildColumns(tribeIds) {
  grid.innerHTML = "";
  tribeIds.forEach((tid) => {
    grid.insertAdjacentHTML("beforeend", `
      <div class="build-header" id="build-${tid}"></div>
      <div class="build-header" id="build-${tid}-r" style="border-right:2px solid #3a3a4a;"></div>
    `);
  });
  tribeIds.forEach((tid) => {
    grid.insertAdjacentHTML("beforeend", `
      <div class="col prompt-col" id="prompt-${tid}"><div class="col-label">sent to llm</div></div>
      <div class="col response-col" id="response-${tid}" style="border-right:2px solid #3a3a4a;"><div class="col-label">raw response</div></div>
    `);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Explicit request: "put the inventory/build at the top of the Tribe
// columns." tribe.to_dict() is sent whole (see Simulation.debug_snapshot's
// own comment) -- picks the same core fields the main board's own sidebar
// leads with, so this never has to re-derive a second field list.
function buildHeaderText(t) {
  const pop = t.population ?? 0;
  const era = t.era_label ?? "?";
  const res = `🪵${t.wood ?? 0} 🪨${t.stone ?? 0} 🍖${t.food ?? 0} 💧${t.water ?? 0}`;
  const buildings = [];
  if (t.kitchen_built) buildings.push("Kitchen");
  if (t.long_houses_built) buildings.push(`${t.long_houses_built} Long House`);
  if (t.fishery_built) buildings.push("Fishery");
  if (t.tannery_built) buildings.push("Tannery");
  if (t.warehouses_built) buildings.push(`${t.warehouses_built} Warehouse${t.warehouse_upgrades ? `+${t.warehouse_upgrades}up` : ""}`);
  if (t.bath_house_built) buildings.push("Bath House");
  if (t.well_built) buildings.push("Well");
  const buildLine = buildings.length ? buildings.join(", ") : "no structures yet";
  return { pop, era, res, buildLine };
}

function updateBuildHeader(tid, t) {
  const { pop, era, res, buildLine } = buildHeaderText(t);
  const html = `<span class="tribe-name">${escapeHtml(t.name || tid)}${t.extinct ? " 💀" : ""}</span>Pop ${pop} · ${escapeHtml(era)}\n${res}\n${escapeHtml(buildLine)}`;
  const left = document.getElementById(`build-${tid}`);
  const right = document.getElementById(`build-${tid}-r`);
  if (left) left.innerHTML = html;
  if (right) right.innerHTML = html;
}

function appendNewTranscriptEntries(tid, transcript) {
  const promptCol = document.getElementById(`prompt-${tid}`);
  const responseCol = document.getElementById(`response-${tid}`);
  if (!promptCol || !responseCol) return;

  const key = `${tid}`;
  const lastCycle = renderedCycleByColumn[key] ?? -1;
  const newEntries = transcript.filter((e) => e.cycle > lastCycle);
  if (newEntries.length === 0) return;

  newEntries.forEach((e) => {
    const meta = `cycle ${e.cycle} · ${Math.round(e.latency_ms ?? 0)}ms`;
    promptCol.insertAdjacentHTML("beforeend",
      `<div class="entry"><div class="entry-meta">${meta}</div><div class="entry-text">${e.prompt ? escapeHtml(e.prompt) : '<span class="empty-note">(empty)</span>'}</div></div>`);
    responseCol.insertAdjacentHTML("beforeend",
      `<div class="entry"><div class="entry-meta">${meta}</div><div class="entry-text">${e.raw_response ? escapeHtml(e.raw_response) : '<span class="empty-note">(no response)</span>'}</div></div>`);
  });
  renderedCycleByColumn[key] = Math.max(...transcript.map((e) => e.cycle));

  promptCol.scrollTop = promptCol.scrollHeight;
  responseCol.scrollTop = responseCol.scrollHeight;
}

connect();
</script>
</body>
</html>
